# Gradle 运行参数（本机 JDK 17 由全局 ~/.gradle/gradle.properties 指定）
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# ForgeGradle 每次应用插件都会去连 maven.minecraftforge.net / libraries.minecraft.net 做证书自检，
# 国内网络实测会卡住数分钟；关掉这项纯联网自检不影响任何构建产物。
systemProp.net.minecraftforge.gradle.check.certs=false
# 本机 maven.minecraftforge.net / repo.spongepowered.org 不可达：把 HTTP 超时压短，
# 让 Gradle 尽快失败并回落到其它仓库或本地缓存，而不是每次卡几分钟。
systemProp.org.gradle.internal.http.connectionTimeout=5000
systemProp.org.gradle.internal.http.socketTimeout=5000

# 平台版本
minecraft_version=1.20.1
forge_version=47.4.10

# 模组自身信息
mod_id=summy_threat
mod_name=Summy Threat
mod_version=0.1.0
maven_group=com.summy.threat
archives_base_name=summy-threat
